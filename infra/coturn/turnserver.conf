# TeamTalk coturn TURN/STUN Server Configuration
# Designed for reliable enterprise WebRTC audio & video calling across NATs and firewalls

listening-port=3478
tls-listening-port=5349
alt-listening-port=3479
alt-tls-listening-port=5350

# Realm must match backend TURN_REALM setting
realm=teamtalk.internal

# Long-term credential mechanism with HMAC-SHA1 shared secret
lt-cred-mech
use-auth-secret
static-auth-secret=teamtalk_turn_secret_change_in_production_9f81a7b

# Fingerprint in all STUN and TURN packets
fingerprint

# Bandwidth and rate limit controls
total-quota=100
bps-capacity=0
stale-nonce=600

# Security: prevent looping and reflection attacks
no-loopback-peers
no-multicast-peers

# Port range for UDP media relay
min-port=49152
max-port=65535

# Verbose logging in production (0 for quiet, 1 for active debugging)
verbose
log-file=stdout
